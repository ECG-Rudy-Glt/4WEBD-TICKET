services:

  # -------------------------------------------------------
  # auth-service (x2 + LB + DB primary/replica)
  # -------------------------------------------------------

  auth-service-1:
    restart: on-failure
    build: ./services/auth/auth-service
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - USER_URL=http://user-lb:3010/users
    depends_on:
      user-lb:
        condition: service_started

  auth-service-2:
    restart: on-failure
    build: ./services/auth/auth-service
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - USER_URL=http://user-lb:3010/users
    depends_on:
      user-lb:
        condition: service_started

  auth-lb:
    restart: unless-stopped
    build: ./services/auth/lb
    ports:
      - "3011:3011"
    depends_on:
      - auth-service-1
      - auth-service-2



  # -------------------------------------------------------
  # user-service (x2 + LB + DB primary/replica)
  # -------------------------------------------------------

  user-service-1:
    restart: on-failure
    build: ./services/user/user-service
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://user_user:user_pass@user-db:5432/user_db
      - DATABASE_REPLICA_URL=postgresql://user_user:user_pass@user-db-replica:5432/user_db
    depends_on:
      user-db:
        condition: service_healthy

  user-service-2:
    restart: on-failure
    build: ./services/user/user-service
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://user_user:user_pass@user-db:5432/user_db
      - DATABASE_REPLICA_URL=postgresql://user_user:user_pass@user-db-replica:5432/user_db
    depends_on:
      user-db:
        condition: service_healthy

  user-lb:
    restart: unless-stopped
    build: ./services/user/lb
    ports:
      - "3010:3010"
    depends_on:
      user-service-1:
        condition: service_started
      user-service-2:
        condition: service_started

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
      POSTGRES_DB: user_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - user-pgdata:/var/lib/postgresql/data
      - ./services/user/db/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh

  user-db-replica:
    build: ./services/user/db-replica
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: replicator
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
      POSTGRES_DB: user_db
    volumes:
      - user-pgreplica:/var/lib/postgresql/data
    depends_on:
      user-db:
        condition: service_healthy

  # -------------------------------------------------------
  # event-service (x2 + LB + DB primary/replica)
  # -------------------------------------------------------

  event-service-1:
    restart: on-failure
    build: ./services/event/event-service
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://event_user:event_pass@event-db:5432/event_db
      - DATABASE_REPLICA_URL=postgresql://event_user:event_pass@event-db-replica:5432/event_db
    depends_on:
      event-db:
        condition: service_healthy

  event-service-2:
    restart: on-failure
    build: ./services/event/event-service
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://event_user:event_pass@event-db:5432/event_db
      - DATABASE_REPLICA_URL=postgresql://event_user:event_pass@event-db-replica:5432/event_db
    depends_on:
      event-db:
        condition: service_healthy

  event-lb:
    restart: unless-stopped
    build: ./services/event/lb
    ports:
      - "3020:3020"
    depends_on:
      - event-service-1
      - event-service-2

  event-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_pass
      POSTGRES_DB: event_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d event_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - event-pgdata:/var/lib/postgresql/data
      - ./services/event/db/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh

  event-db-replica:
    build: ./services/event/db-replica
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: replicator
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_pass
      POSTGRES_DB: event_db
    volumes:
      - event-pgreplica:/var/lib/postgresql/data
    depends_on:
      event-db:
        condition: service_healthy

  # -------------------------------------------------------
  # booking-service (x2 + LB + DB primary/replica)
  # -------------------------------------------------------

  booking-service-1:
    restart: on-failure
    build: ./services/booking/booking-service
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://booking_user:booking_pass@booking-db:5432/booking_db
      - DATABASE_REPLICA_URL=postgresql://booking_user:booking_pass@booking-db-replica:5432/booking_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - EVENT_URL=http://event-lb:3020/events
    depends_on:
      booking-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  booking-service-2:
    restart: on-failure
    build: ./services/booking/booking-service
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://booking_user:booking_pass@booking-db:5432/booking_db
      - DATABASE_REPLICA_URL=postgresql://booking_user:booking_pass@booking-db-replica:5432/booking_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - EVENT_URL=http://event-lb:3020/events
    depends_on:
      booking-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  booking-lb:
    restart: unless-stopped
    build: ./services/booking/lb
    ports:
      - "3021:3021"
    depends_on:
      - booking-service-1
      - booking-service-2

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
      POSTGRES_DB: booking_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - booking-pgdata:/var/lib/postgresql/data
      - ./services/booking/db/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh

  booking-db-replica:
    build: ./services/booking/db-replica
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: replicator
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
      POSTGRES_DB: booking_db
    volumes:
      - booking-pgreplica:/var/lib/postgresql/data
    depends_on:
      booking-db:
        condition: service_healthy

  # -------------------------------------------------------
  # payment-service (x1 + DB primary/replica)
  # -------------------------------------------------------

  payment-service:
    restart: on-failure
    build: ./services/payment/payment-service
    ports:
      - "3022:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://payment_user:payment_pass@payment-db:5432/payment_db
      - DATABASE_REPLICA_URL=postgresql://payment_user:payment_pass@payment-db-replica:5432/payment_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - BOOKING_URL=http://booking-lb:3021/tickets
      - EVENT_URL=http://event-lb:3020/events
      - SIMULATE_FAILURE_RATE=${SIMULATE_FAILURE_RATE:-0.1}
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      booking-lb:
        condition: service_started

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - payment-pgdata:/var/lib/postgresql/data
      - ./services/payment/db/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh

  payment-db-replica:
    build: ./services/payment/db-replica
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: replicator
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_db
    volumes:
      - payment-pgreplica:/var/lib/postgresql/data
    depends_on:
      payment-db:
        condition: service_healthy


  payment-db-backup:
    image: postgres:16-alpine
    environment:
      PAYMENT_DB_HOST: payment-db
      PAYMENT_DB_USER: payment_user
      PAYMENT_DB_NAME: payment_db
      PAYMENT_DB_PASSWORD: payment_pass
    volumes:
      - ./scripts/backup-payment.sh:/backup.sh
      - payment-backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      payment-db:
        condition: service_healthy

  # -------------------------------------------------------
  # notification-service (x1 + DB)
  # -------------------------------------------------------

  notification-service:
    restart: on-failure
    build: ./services/notification/notification-service
    ports:
      - "3023:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://notif_user:notif_pass@notif-db:5432/notif_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      notif-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notif-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notif_user
      POSTGRES_PASSWORD: notif_pass
      POSTGRES_DB: notif_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif_user -d notif_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - notif-pgdata:/var/lib/postgresql/data
      - ./services/notification/db/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh

  notif-db-replica:
    build: ./services/notification/db-replica
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: replicator
      POSTGRES_USER: notif_user
      POSTGRES_PASSWORD: notif_pass
      POSTGRES_DB: notif_db
    volumes:
      - notif-pgreplica:/var/lib/postgresql/data
    depends_on:
      notif-db:
        condition: service_healthy

  # -------------------------------------------------------
  # api-gateway (x2 + LB)
  # -------------------------------------------------------

  api-gateway-1:
    restart: on-failure
    build: ./services/gateway/api-gateway
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - USER_URL=http://user-lb:3010/users
      - EVENT_URL=http://event-lb:3020/events
      - AUTH_URL=http://auth-lb:3011/auth
      - BOOKING_URL=http://booking-lb:3021/tickets
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - user-lb
      - event-lb
      - auth-lb
      - booking-lb
      - rabbitmq

  api-gateway-2:
    restart: on-failure
    build: ./services/gateway/api-gateway
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - USER_URL=http://user-lb:3010/users
      - EVENT_URL=http://event-lb:3020/events
      - AUTH_URL=http://auth-lb:3011/auth
      - BOOKING_URL=http://booking-lb:3021/tickets
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - user-lb
      - event-lb
      - auth-lb
      - booking-lb
      - rabbitmq

  gateway-lb:
    restart: unless-stopped
    build: ./services/gateway/lb
    ports:
      - "3030:3030"
    depends_on:
      - api-gateway-1
      - api-gateway-2

  # -------------------------------------------------------
  # Infrastructure partagée
  # -------------------------------------------------------

  rabbitmq:
    image: rabbitmq:3.11-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  # -------------------------------------------------------
  # Frontend
  # -------------------------------------------------------

  frontend:
    build: ./services/frontend/frontend-app
    ports:
      - "8080:80"
    depends_on:
      - gateway-lb

volumes:
  user-pgdata:
  user-pgreplica:
  event-pgdata:
  event-pgreplica:
  booking-pgdata:
  booking-pgreplica:
  payment-pgdata:
  payment-pgreplica:
  payment-backups:
  notif-pgdata:
  notif-pgreplica:
  rabbitmqdata:
