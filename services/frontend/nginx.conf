server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy vers le nginx frontal → gateway
    # Le frontend ne proxie plus directement — c'est le nginx frontal qui gère /api/
    # Cette config sert uniquement les fichiers statiques du SPA

    location / {
        try_files $uri $uri/ /index.html;
    }
}
