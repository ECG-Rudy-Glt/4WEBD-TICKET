global
    maxconn 100

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout connect  4s
    timeout server  30m
    timeout check    5s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends

# ── Ecriture → primary uniquement ────────────────────────────────────────────
frontend user_write
    bind *:5432
    default_backend user_primary

backend user_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server user-db-1 user-db-1:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc
    server user-db-2 user-db-2:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc
    server user-db-3 user-db-3:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc

# ── Lecture → replicas ────────────────────────────────────────────────────────
frontend user_read
    bind *:5433
    default_backend user_replicas

backend user_replicas
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server user-db-1 user-db-1:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc
    server user-db-2 user-db-2:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc
    server user-db-3 user-db-3:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc
