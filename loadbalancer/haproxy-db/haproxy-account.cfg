global
    maxconn 100

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout connect  4s
    timeout server  30m
    timeout check    5s

# Resolver Docker interne — permet la résolution DNS dynamique des containers
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

# Interface de stats HAProxy
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends

# ── Ecriture → primary uniquement ────────────────────────────────────────────
frontend account_write
    bind *:5432
    default_backend account_primary

backend account_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server account-db-1 account-db-1:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc
    server account-db-2 account-db-2:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc
    server account-db-3 account-db-3:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc

# ── Lecture → replicas (fallback primary si tous les replicas sont down) ──────
frontend account_read
    bind *:5433
    default_backend account_replicas

backend account_replicas
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server account-db-1 account-db-1:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc
    server account-db-2 account-db-2:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc
    server account-db-3 account-db-3:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr none,libc
