<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigBank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>BigBank</h1>
        <nav>
            <button onclick="showSection('users')">Utilisateurs</button>
            <button onclick="showSection('accounts')">Comptes</button>
            <button onclick="showSection('transactions')">Transactions</button>
        </nav>
    </header>

    <main>
        <section id="users" class="section">
            <h2>Utilisateurs</h2>
            <div class="card">
                <h3>Créer un utilisateur</h3>
                <form id="createUserForm">
                    <input type="text" name="firstname" placeholder="Prénom" required>
                    <input type="text" name="lastname" placeholder="Nom" required>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="text" name="phone" placeholder="Téléphone (optionnel)">
                    <input type="password" name="password" placeholder="Mot de passe (8 car. min)" required>
                    <button type="submit">Créer</button>
                </form>
            </div>
            <div class="card">
                <h3>Liste des utilisateurs</h3>
                <button onclick="loadUsers()">Charger</button>
                <div id="usersList"></div>
            </div>
        </section>

        <section id="accounts" class="section hidden">
            <h2>Comptes</h2>
            <div class="card">
                <h3>Créer un compte</h3>
                <form id="createAccountForm">
                    <input type="number" name="userId" placeholder="ID utilisateur" required>
                    <input type="text" name="label" placeholder="Nom du compte" required>
                    <select name="type">
                        <option value="checking">Courant (checking)</option>
                        <option value="savings">Épargne (savings)</option>
                    </select>
                    <button type="submit">Créer</button>
                </form>
            </div>
            <div class="card">
                <h3>Comptes d'un utilisateur</h3>
                <input type="number" id="accountsUserId" placeholder="ID utilisateur">
                <button onclick="loadAccounts()">Charger</button>
                <div id="accountsList"></div>
            </div>
        </section>

        <section id="transactions" class="section hidden">
            <h2>Transactions</h2>
            <div class="card">
                <h3>Faire un virement</h3>
                <form id="createTransactionForm">
                    <input type="number" name="fromAccountId" placeholder="ID compte source" required>
                    <input type="number" name="toAccountId" placeholder="ID compte destination" required>
                    <input type="number" name="amount" placeholder="Montant" step="0.01" required>
                    <input type="text" name="description" placeholder="Description (optionnel)">
                    <button type="submit">Virer</button>
                </form>
            </div>
            <div class="card">
                <h3>Toutes les transactions</h3>
                <button onclick="loadTransactions()">Charger</button>
                <div id="transactionsList"></div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
