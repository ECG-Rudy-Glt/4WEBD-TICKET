      context: ./services/booking-service/src
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${BOOKING_DB_USER:-booking_user}:${BOOKING_DB_PASSWORD:-booking_pass}@booking-pgbouncer:6432/${BOOKING_DB_NAME:-booking_db}
      DATABASE_REPLICA_URL: postgresql://${BOOKING_DB_USER:-booking_user}:${BOOKING_DB_PASSWORD:-booking_pass}@booking-pgbouncer:6432/${BOOKING_DB_NAME:-booking_db}_readonly
