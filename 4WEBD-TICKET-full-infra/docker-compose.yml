      POSTGRESQL_PASSWORD: user_pass
      POSTGRESQL_DATABASE: user_db
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    volumes:
      - ./infra/pgbouncer/user/pgbouncer.ini:/bitnami/pgbouncer/conf/pgbouncer.ini
      - ./infra/pgbouncer/user/userlist.txt:/bitnami/pgbouncer/conf/userlist.txt
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped

  user-db:
    image: bitnamilegacy/postgresql:16-debian-12
    environment:
      POSTGRESQL_USERNAME: ${USER_DB_USER:-user_user}
      POSTGRESQL_PASSWORD: ${USER_DB_PASSWORD:-user_pass}
      POSTGRESQL_DATABASE: ${USER_DB_NAME:-user_db}
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: ${REPLICATION_USER:-replicator}
      POSTGRESQL_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pass}
    healthcheck:
