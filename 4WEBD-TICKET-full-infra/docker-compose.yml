  booking-pgbouncer:
    image: bitnamilegacy/pgbouncer:latest
    environment:
      POSTGRESQL_HOST: booking-db-1
      POSTGRESQL_USERNAME: booking_user
      POSTGRESQL_PASSWORD: booking_pass
      POSTGRESQL_DATABASE: booking_db
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    volumes:
      - ./infra/pgbouncer/booking/pgbouncer.ini:/bitnami/pgbouncer/conf/pgbouncer.ini
