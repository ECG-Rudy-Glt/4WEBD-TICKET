      DATABASE_REPLICA_URL: postgresql://${USER_DB_USER:-user_user}:${USER_DB_PASSWORD:-user_pass}@user-pgbouncer:6432/${USER_DB_NAME:-user_db}_readonly
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
