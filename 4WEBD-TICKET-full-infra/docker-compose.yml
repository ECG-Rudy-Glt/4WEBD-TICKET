      PATRONI_NAME: payment-db-1
      PATRONI_PRIORITY: 100
      PATRONI_CONNECT_HOST: payment-db-1
      POSTGRES_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD:-postgres_pass}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pass}
      DB_USER: ${PAYMENT_DB_USER:-payment_user}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_pass}
      DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
    volumes:
      - payment-pgdata-1:/var/lib/postgresql/data
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    restart: unless-stopped

  payment-db-2:
    build:
      context: ./patroni
    environment:
      PATRONI_SCOPE: payment-cluster
      PATRONI_NAME: payment-db-2
      PATRONI_PRIORITY: 50
      PATRONI_CONNECT_HOST: payment-db-2
      POSTGRES_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD:-postgres_pass}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pass}
      DB_USER: ${PAYMENT_DB_USER:-payment_user}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_pass}
      DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
    volumes:
      - payment-pgdata-2:/var/lib/postgresql/data
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    restart: unless-stopped

  payment-db-3:
    build:
      context: ./patroni
    environment:
      PATRONI_SCOPE: payment-cluster
      PATRONI_NAME: payment-db-3
      PATRONI_PRIORITY: 50
      PATRONI_CONNECT_HOST: payment-db-3
      POSTGRES_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD:-postgres_pass}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pass}
      DB_USER: ${PAYMENT_DB_USER:-payment_user}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_pass}
      DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
    volumes:
      - payment-pgdata-3:/var/lib/postgresql/data
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ZONE 3 — NOTIFICATION SERVICE (silo standard)
  # ═══════════════════════════════════════════════════════════

  notification-service:
    build:
      context: ./services/notification-service/src
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${NOTIF_DB_USER:-notif_user}:${NOTIF_DB_PASSWORD:-notif_pass}@notif-pgbouncer:6432/${NOTIF_DB_NAME:-notif_db}
      DATABASE_REPLICA_URL: postgresql://${NOTIF_DB_USER:-notif_user}:${NOTIF_DB_PASSWORD:-notif_pass}@notif-pgbouncer:6432/${NOTIF_DB_NAME:-notif_db}_readonly
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    depends_on:
      notif-pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service-replica:
    build:
      context: ./services/notification-service/src
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${NOTIF_DB_USER:-notif_user}:${NOTIF_DB_PASSWORD:-notif_pass}@notif-pgbouncer:6432/${NOTIF_DB_NAME:-notif_db}
      DATABASE_REPLICA_URL: postgresql://${NOTIF_DB_USER:-notif_user}:${NOTIF_DB_PASSWORD:-notif_pass}@notif-pgbouncer:6432/${NOTIF_DB_NAME:-notif_db}_readonly
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    depends_on:
      notif-pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notif-pgbouncer:
    image: bitnamilegacy/pgbouncer:latest
    environment:
      POSTGRESQL_HOST: notif-db
      POSTGRESQL_USERNAME: notif_user
      POSTGRESQL_PASSWORD: notif_pass
      POSTGRESQL_DATABASE: notif_db
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    volumes:
      - ./infra/pgbouncer/notif/pgbouncer.ini:/bitnami/pgbouncer/conf/pgbouncer.ini
      - ./infra/pgbouncer/notif/userlist.txt:/bitnami/pgbouncer/conf/userlist.txt
    depends_on:
      notif-db:
        condition: service_healthy
    restart: unless-stopped

  notif-db:
    image: bitnamilegacy/postgresql:16-debian-12
    environment:
      POSTGRESQL_USERNAME: ${NOTIF_DB_USER:-notif_user}
      POSTGRESQL_PASSWORD: ${NOTIF_DB_PASSWORD:-notif_pass}
      POSTGRESQL_DATABASE: ${NOTIF_DB_NAME:-notif_db}
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: ${REPLICATION_USER:-replicator}
      POSTGRESQL_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIF_DB_USER:-notif_user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - notif-pgdata:/bitnami/postgresql
    restart: unless-stopped

  notif-db-replica:
    image: bitnamilegacy/postgresql:16-debian-12
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: notif-db
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_USERNAME: ${NOTIF_DB_USER:-notif_user}
      POSTGRESQL_PASSWORD: ${NOTIF_DB_PASSWORD:-notif_pass}
      POSTGRESQL_REPLICATION_USER: ${REPLICATION_USER:-replicator}
      POSTGRESQL_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pass}
    depends_on:
      notif-db:
        condition: service_healthy
    volumes:
      - notif-pgreplica:/bitnami/postgresql
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ZONE 4 — ETCD CLUSTER (consensus pour Patroni)
  # ═══════════════════════════════════════════════════════════

  etcd-1:
    image: bitnamilegacy/etcd:3.6.4-debian-12-r4
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_NAME: etcd-1
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-ticket-cluster
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - etcd-1-data:/bitnami/etcd
    restart: unless-stopped

  etcd-2:
    image: bitnamilegacy/etcd:3.6.4-debian-12-r4
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_NAME: etcd-2
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-ticket-cluster
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - etcd-2-data:/bitnami/etcd
    restart: unless-stopped

  etcd-3:
    image: bitnamilegacy/etcd:3.6.4-debian-12-r4
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_NAME: etcd-3
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-ticket-cluster
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - etcd-3-data:/bitnami/etcd
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ZONE 5 — INFRASTRUCTURE PARTAGÉE
  # ═══════════════════════════════════════════════════════════

  rabbitmq:
    image: rabbitmq:3.11-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ZONE 6 — OBSERVABILITÉ
  # ═══════════════════════════════════════════════════════════

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ZONE 7 — MAINTENANCE
  # ═══════════════════════════════════════════════════════════

  cron-backup:
    build:
      context: ./infra/cron-backup
    depends_on:
      payment-pgbouncer:
        condition: service_started
    restart: unless-stopped

# =============================================================
# VOLUMES
# =============================================================

volumes:
  # Standard silos (Bitnami master/slave)
  auth-pgdata:
  auth-pgreplica:
  user-pgdata:
  user-pgreplica:
  event-pgdata:
  event-pgreplica:
  notif-pgdata:
  notif-pgreplica:
  # Critical silos (Patroni 3 nœuds)
  booking-pgdata-1:
  booking-pgdata-2:
  booking-pgdata-3:
  payment-pgdata-1:
  payment-pgdata-2:
  payment-pgdata-3:
  # ETCD
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:
  # Infrastructure
  rabbitmqdata:
  redisdata:
