      DATABASE_REPLICA_URL: postgresql://${EVENT_DB_USER:-event_user}:${EVENT_DB_PASSWORD:-event_pass}@event-pgbouncer:6432/${EVENT_DB_NAME:-event_db}_readonly
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
