    depends_on:
      booking-db-1:
        condition: service_started
    restart: unless-stopped

  # Patroni HA cluster — Booking (3 nœuds)
  booking-db-1:
    build:
      context: ./patroni
    environment:
      PATRONI_SCOPE: booking-cluster
      PATRONI_NAME: booking-db-1
      PATRONI_PRIORITY: 100
      PATRONI_CONNECT_HOST: booking-db-1
      POSTGRES_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD:-postgres_pass}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pass}
      DB_USER: ${BOOKING_DB_USER:-booking_user}
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_pass}
      DB_NAME: ${BOOKING_DB_NAME:-booking_db}
    volumes:
      - booking-pgdata-1:/var/lib/postgresql/data
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    restart: unless-stopped

  booking-db-2:
