      POSTGRESQL_PASSWORD: ${EVENT_DB_PASSWORD:-event_pass}
      POSTGRESQL_REPLICATION_USER: ${REPLICATION_USER:-replicator}
      POSTGRESQL_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pass}
    depends_on:
      event-db:
        condition: service_healthy
    volumes:
      - event-pgreplica:/bitnami/postgresql
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ZONE 3 — BOOKING SERVICE (silo critique — Patroni HA)
  # ═══════════════════════════════════════════════════════════

  booking-service:
    build:
      context: ./services/booking-service/src
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${BOOKING_DB_USER:-booking_user}:${BOOKING_DB_PASSWORD:-booking_pass}@booking-pgbouncer:6432/${BOOKING_DB_NAME:-booking_db}
      DATABASE_REPLICA_URL: postgresql://${BOOKING_DB_USER:-booking_user}:${BOOKING_DB_PASSWORD:-booking_pass}@booking-pgbouncer:6432/${BOOKING_DB_NAME:-booking_db}_readonly
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      EVENT_URL: http://event-service:3006
    depends_on:
      booking-pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
