# =============================================================
# 4WEBD-TICKET — Docker Compose — Architecture complète
#
# Couches :
#   Frontal     : 2x Nginx + 2x Frontend + 2x API Gateway
#   App         : 6 services x 2 réplicas
#   Proxy DB    : 6x PgBouncer (1 par silo)
#   DB          : 2 silos critiques (Patroni HA 3 nœuds)
#                 + 4 silos standards (Bitnami master/slave)
#   Consensus   : 3x ETCD (pour Patroni)
#   Msg & Cache : 1x RabbitMQ + 1x Redis
#   Observabilité : 1x Zipkin
#   Maintenance : 1x Cron Backup (payment)
#
# Point d'entrée : http://localhost (nginx frontal)
# RabbitMQ UI     : http://localhost:15672
# Zipkin UI       : http://localhost:9411
# =============================================================

services:

  # ═══════════════════════════════════════════════════════════
  # ZONE 1 — FRONTAL (Nginx + Frontend)
  # ═══════════════════════════════════════════════════════════

  nginx:
    build:
      context: ./infra/nginx-frontal
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - api-gateway-replica
      - frontend
      - frontend-replica
    restart: unless-stopped

  nginx-replica:
    build:
      context: ./infra/nginx-frontal
    depends_on:
      - api-gateway
      - api-gateway-replica
      - frontend
      - frontend-replica
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend/frontend-app
    restart: unless-stopped

  frontend-replica:
    build:
      context: ./services/frontend/frontend-app
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ZONE 2 — API GATEWAY (x2)
  # ═══════════════════════════════════════════════════════════

  api-gateway:
    build:
      context: ./services/gateway/api-gateway
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      AUTH_URL: http://auth-service:3004
      USER_URL: http://user-service:3001
      EVENT_URL: http://event-service:3006
      BOOKING_URL: http://booking-service:3003
      PAYMENT_URL: http://payment-service:3005
      NOTIFICATION_URL: http://notification-service:3002
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      event-service:
        condition: service_started
      booking-service:
        condition: service_started
    restart: unless-stopped

  api-gateway-replica:
    build:
      context: ./services/gateway/api-gateway
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      AUTH_URL: http://auth-service-replica:3004
      USER_URL: http://user-service-replica:3001
      EVENT_URL: http://event-service-replica:3006
      BOOKING_URL: http://booking-service-replica:3003
      PAYMENT_URL: http://payment-service-replica:3005
      NOTIFICATION_URL: http://notification-service-replica:3002
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service-replica:
        condition: service_started
      user-service-replica:
        condition: service_started
      event-service-replica:
        condition: service_started
      booking-service-replica:
        condition: service_started
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ZONE 3 — AUTH SERVICE (silo standard)
  # ═══════════════════════════════════════════════════════════

  auth-service:
    build:
      context: ./services/auth-service/src
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:-auth_pass}@auth-pgbouncer:6432/${AUTH_DB_NAME:-auth_db}
      DATABASE_REPLICA_URL: postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:-auth_pass}@auth-pgbouncer:6432/${AUTH_DB_NAME:-auth_db}_readonly
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-pgbouncer:
        condition: service_started
    restart: unless-stopped

  auth-service-replica:
    build:
      context: ./services/auth-service/src
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:-auth_pass}@auth-pgbouncer:6432/${AUTH_DB_NAME:-auth_db}
      DATABASE_REPLICA_URL: postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:-auth_pass}@auth-pgbouncer:6432/${AUTH_DB_NAME:-auth_db}_readonly
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-pgbouncer:
        condition: service_started
    restart: unless-stopped

  auth-pgbouncer:
    image: bitnamilegacy/pgbouncer:latest
    environment:
      POSTGRESQL_HOST: auth-db
      POSTGRESQL_USERNAME: auth_user
      POSTGRESQL_PASSWORD: auth_pass
      POSTGRESQL_DATABASE: auth_db
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    volumes:
      - ./infra/pgbouncer/auth/pgbouncer.ini:/bitnami/pgbouncer/conf/pgbouncer.ini
      - ./infra/pgbouncer/auth/userlist.txt:/bitnami/pgbouncer/conf/userlist.txt
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  auth-db:
    image: bitnamilegacy/postgresql:16-debian-12
    environment:
      POSTGRESQL_USERNAME: ${AUTH_DB_USER:-auth_user}
      POSTGRESQL_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      POSTGRESQL_DATABASE: ${AUTH_DB_NAME:-auth_db}
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: ${REPLICATION_USER:-replicator}
      POSTGRESQL_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - auth-pgdata:/bitnami/postgresql
    restart: unless-stopped

  auth-db-replica:
    image: bitnamilegacy/postgresql:16-debian-12
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: auth-db
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_USERNAME: ${AUTH_DB_USER:-auth_user}
      POSTGRESQL_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      POSTGRESQL_REPLICATION_USER: ${REPLICATION_USER:-replicator}
      POSTGRESQL_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pass}
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - auth-pgreplica:/bitnami/postgresql
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
