[databases]
event_db = host=event-db port=5432 dbname=event_db
event_db_readonly = host=event-db-replica port=5432 dbname=event_db

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = plain
auth_file = /bitnami/pgbouncer/conf/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
log_connections = 1
log_disconnections = 1
admin_users = event_user
