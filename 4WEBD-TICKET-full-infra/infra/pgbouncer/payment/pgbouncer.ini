[databases]
payment_db = host=payment-db-1 port=5432 dbname=payment_db
payment_db_readonly = host=payment-db-2 port=5432 dbname=payment_db

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = plain
auth_file = /bitnami/pgbouncer/conf/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
log_connections = 1
log_disconnections = 1
admin_users = payment_user
