[databases]
booking_db = host=booking-db-1 port=5432 dbname=booking_db
booking_db_readonly = host=booking-db-2 port=5432 dbname=booking_db

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = plain
auth_file = /bitnami/pgbouncer/conf/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
log_connections = 1
log_disconnections = 1
admin_users = booking_user
