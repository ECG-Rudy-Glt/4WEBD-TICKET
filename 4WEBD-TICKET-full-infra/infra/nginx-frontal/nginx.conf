# =============================================================
# Nginx Frontal — Point d'entrée unique (IP publique)
# Rate Limiting + Reverse Proxy vers API Gateway + Frontend
# =============================================================

# Rate limiting : 10 req/s par IP, burst de 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/s;

# Upstream : API Gateway
upstream gateway_backend {
    server gateway-lb:3030;
}

# Upstream : Frontend SPA
upstream frontend_backend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # ── Sécurité headers ──
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # ── API : proxy vers l'API Gateway ──
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        # Réécriture : /api/auth/login → /auth/login
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # ── Health check gateway ──
    location /api-health {
        proxy_pass http://gateway_backend/health;
        proxy_set_header Host $host;
    }

    # ── Frontend : proxy vers les containers SPA ──
    location / {
        limit_req zone=global_limit burst=50 nodelay;

        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
