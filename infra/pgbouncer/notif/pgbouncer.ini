[databases]
notif_db = host=notif-db port=5432 dbname=notif_db
notif_db_readonly = host=notif-db-replica port=5432 dbname=notif_db

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = plain
auth_file = /bitnami/pgbouncer/conf/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
log_connections = 1
log_disconnections = 1
admin_users = notif_user
