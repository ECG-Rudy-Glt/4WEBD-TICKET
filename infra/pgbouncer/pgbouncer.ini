# PgBouncer — Pooler de connexions PostgreSQL
# Un pgbouncer par service DB (adapter les valeurs)

[databases]
auth_db = host=auth-db port=5432 dbname=auth_db
booking_db = host=booking-db port=5432 dbname=booking_db
payment_db = host=payment-db port=5432 dbname=payment_db
notif_db = host=notif-db port=5432 dbname=notif_db

[pgbouncer]
listen_port = 6432
listen_addr = *
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
log_connections = 1
log_disconnections = 1
