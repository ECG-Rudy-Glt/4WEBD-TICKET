########################### NOTIFICATION SERVICE ##############################
  loadbalancer-notification-service:
    container_name: loadbalancer-notification-service
    build:
      context: ./loadbalancer/loadbalancer-notification-service
      dockerfile: ./Dockerfile
    networks:
      - BigBank
    depends_on:
      - notification-service
      - notification-service2

  notification-service:
    container_name: notification-service
    build:
      context: ./services/notification-service
      dockerfile: ./Dockerfile
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    networks:
      - BigBank
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service2:
    container_name: notification-service2
    build:
      context: ./services/notification-service
      dockerfile: ./Dockerfile
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    networks:
      - BigBank
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

########################### ACCOUNT SERVICE #################################
  loadbalancer-account-service:
    container_name: loadbalancer-account-service
    build:
      context: ./loadbalancer/loadbalancer-account-service
      dockerfile: ./Dockerfile
    networks:
      - BigBank
    depends_on:
      - account-service
      - account-service2

  account-service:
    container_name: account-service
    build:
      context: ./services/account-service
      dockerfile: ./Dockerfile
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - DB_HOST_WRITE=haproxy-account-db
      - DB_PORT_WRITE=5432
      - DB_HOST_READ=haproxy-account-db
      - DB_PORT_READ=5433
      - DB_NAME=${ACCOUNT_DB_NAME}
      - DB_USER=${ACCOUNT_DB_USER}
      - DB_PASSWORD=${ACCOUNT_DB_PASSWORD}
    networks:
      - BigBank
    depends_on:
      haproxy-account-db:
        condition: service_healthy
    restart: unless-stopped

  account-service2:
    container_name: account-service2
    build:
      context: ./services/account-service
      dockerfile: ./Dockerfile
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - DB_HOST_WRITE=haproxy-account-db
      - DB_PORT_WRITE=5432
      - DB_HOST_READ=haproxy-account-db
      - DB_PORT_READ=5433
      - DB_NAME=${ACCOUNT_DB_NAME}
      - DB_USER=${ACCOUNT_DB_USER}
      - DB_PASSWORD=${ACCOUNT_DB_PASSWORD}
    networks:
      - BigBank
    depends_on:
      haproxy-account-db:
        condition: service_healthy
    restart: unless-stopped

########################### ACCOUNT DB CLUSTER (Patroni + HAProxy) ############

  haproxy-account-db:
    container_name: haproxy-account-db
    build:
      context: ./loadbalancer/haproxy-db
      dockerfile: ./Dockerfile
      args:
        CFG_FILE: haproxy-account.cfg
    networks:
      - BigBank
    depends_on:
      - account-db-1
      - account-db-2
      - account-db-3
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5432"]
      interval: 5s
      timeout: 3s
      retries: 10

  account-db-1:
    container_name: account-db-1
    build:
      context: ./patroni
      dockerfile: ./Dockerfile
    environment:
      - PATRONI_SCOPE=account-cluster
      - PATRONI_NAME=account-db-1
      - PATRONI_CONNECT_HOST=account-db-1
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REPLICATION_USER=${REPLICATION_USER}
      - REPLICATION_PASSWORD=${REPLICATION_PASSWORD}
      - DB_NAME=${ACCOUNT_DB_NAME}
      - DB_USER=${ACCOUNT_DB_USER}
      - DB_PASSWORD=${ACCOUNT_DB_PASSWORD}
    volumes:
      - account-db-1-data:/var/lib/postgresql/data
    networks:
      - BigBank
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped

  account-db-2:
    container_name: account-db-2
    build:
      context: ./patroni
      dockerfile: ./Dockerfile
    environment:
      - PATRONI_SCOPE=account-cluster
      - PATRONI_NAME=account-db-2
      - PATRONI_CONNECT_HOST=account-db-2
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REPLICATION_USER=${REPLICATION_USER}
      - REPLICATION_PASSWORD=${REPLICATION_PASSWORD}
      - DB_NAME=${ACCOUNT_DB_NAME}
      - DB_USER=${ACCOUNT_DB_USER}
      - DB_PASSWORD=${ACCOUNT_DB_PASSWORD}
    volumes:
      - account-db-2-data:/var/lib/postgresql/data
    networks:
      - BigBank
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped

  account-db-3:
    container_name: account-db-3
    build:
      context: ./patroni
      dockerfile: ./Dockerfile
    environment:
      - PATRONI_SCOPE=account-cluster
      - PATRONI_NAME=account-db-3
      - PATRONI_CONNECT_HOST=account-db-3
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REPLICATION_USER=${REPLICATION_USER}
      - REPLICATION_PASSWORD=${REPLICATION_PASSWORD}
      - DB_NAME=${ACCOUNT_DB_NAME}
      - DB_USER=${ACCOUNT_DB_USER}
      - DB_PASSWORD=${ACCOUNT_DB_PASSWORD}
    volumes:
      - account-db-3-data:/var/lib/postgresql/data
    networks:
      - BigBank
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped

########################### USER SERVICE #################################
  loadbalancer-user-service:
    container_name: loadbalancer-user-service
    build:
      context: ./loadbalancer/loadbalancer-user-service
      dockerfile: ./Dockerfile
    networks:
      - BigBank
    depends_on:
      - user-service
