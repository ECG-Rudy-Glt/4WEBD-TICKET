  #   build:
  #     context: ./loadbalancer/loadbalancer-bigbank-admin
  #     dockerfile: ./Dockerfile
  #   networks:
  #     - BigBank

  bigbank-admin:
    container_name: bigbank-admin
    build:
      context: ./services/bigbank-admin
      dockerfile: ./Dockerfile
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    networks:
      - BigBank
    depends_on:
      - loadbalancer-user-service
      - loadbalancer-account-service
      - loadbalancer-transaction-service

  # bigbank-admin2:
