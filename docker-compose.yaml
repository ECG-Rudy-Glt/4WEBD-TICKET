services:

########################### FRONTEND + LB API GATEWAY #########################
  nginx-bigbank:
    container_name: nginx-bigbank
    build:
      context: ./loadbalancer/frontend
      dockerfile: ./Dockerfile
    ports:
      - '80:80'
    networks:
      - BigBank
    depends_on:
      - bigbank
      - bigbank2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  bigbank:
    container_name: bigbank
    build:
      context: ./services/bigbank
      dockerfile: ./Dockerfile
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    networks:
      - BigBank
    depends_on:
      - loadbalancer-user-service
      - loadbalancer-account-service
      - loadbalancer-notification-service
      # - loadbalancer-bigbank-admin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  bigbank2:
    container_name: bigbank2
    build:
      context: ./services/bigbank
      dockerfile: ./Dockerfile
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    networks:
      - BigBank
    depends_on:
      - loadbalancer-user-service
      - loadbalancer-account-service
      - loadbalancer-notification-service
      # - loadbalancer-bigbank-admin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

########################### BIGBANK ADMIN #####################################
