    restart: unless-stopped

########################### TRANSACTION SERVICE ##############################
  loadbalancer-transaction-service:
    container_name: loadbalancer-transaction-service
    build:
      context: ./loadbalancer/loadbalancer-transaction-service
      dockerfile: ./Dockerfile
    networks:
      - BigBank
    depends_on:
      - transaction-service
      - transaction-service2

  transaction-service:
    container_name: transaction-service
    build:
      context: ./services/transaction-service
      dockerfile: ./Dockerfile
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      - ACCOUNT_SERVICE_URL=http://loadbalancer-account-service/accounts
    networks:
      - BigBank
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  transaction-service2:
    container_name: transaction-service2
    build:
      context: ./services/transaction-service
      dockerfile: ./Dockerfile
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      - ACCOUNT_SERVICE_URL=http://loadbalancer-account-service/accounts
    networks:
      - BigBank
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

########################### ETCD (DCS pour Patroni) ##########################
# Note: en production, déployer 3 nœuds etcd pour le quorum

  etcd:
    container_name: etcd
    image: gcr.io/etcd-development/etcd:v3.5.12
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
    volumes:
      - etcd-data:/var/lib/etcd
    networks:
      - BigBank
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

########################### ZIPKIN #####################################

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - BigBank

### POUR PREPARER LA SUITE ###

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    networks:
      - BigBank
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

