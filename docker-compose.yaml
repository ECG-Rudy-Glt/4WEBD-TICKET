    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - DB_HOST_WRITE=haproxy-user-db
      - DB_PORT_WRITE=5432
      - DB_HOST_READ=haproxy-user-db
      - DB_PORT_READ=5433
      - DB_NAME=${USER_DB_NAME}
      - DB_USER=${USER_DB_USER}
      - DB_PASSWORD=${USER_DB_PASSWORD}
    networks:
      - BigBank
    depends_on:
      haproxy-user-db:
